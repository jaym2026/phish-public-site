const PANELS=[{"type": "text", "span": 12, "html": "<h1>Live Threat Intelligence</h1><p>We don't just talk about cybersecurity — we run an automated operation that hunts live phishing scams across the internet, reports them to the hosts and registrars responsible, and confirms when they're taken offline. Everything below is real, refreshes automatically, and reflects the same threat monitoring that protects our clients.</p>"}, {"type": "text", "span": 12, "html": "<h1>Our Phishing-Takedown Program — Impact</h1><p>Every day our systems detect newly-launched phishing sites, corroborate them, file abuse reports, and track each one to removal — sites <strong>confirmed offline after we reported them</strong>. Removal is verified by continuous liveness checks; attribution is by temporal correlation (removal follows the report), strongest for fast takedowns. Backfilled records are excluded and Cloudflare (a proxy) is counted separately, so the numbers stay conservative.</p>"}, {"type": "stat", "span": 4, "title": "Live phishing tracked (now)", "src": "pub_show_pulse", "field": 0, "color": "orange", "fmt": "si"}, {"type": "stat", "span": 4, "title": "New detections today", "src": "pub_show_pulse", "field": 1, "color": "blue", "fmt": "si"}, {"type": "stat", "span": 4, "title": "Takedowns confirmed — last 7 days", "src": "pub_show_pulse", "field": 3, "color": "green", "fmt": "si", "tip": "Distinct phishing sites confirmed offline after we reported them, in the trailing 7 days — a recent-activity slice of the all-time takedown total. Counts only sites we filed a report on, so it is not all-cause mortality; attribution is by temporal correlation (removal follows the report), not provider confirmation."}, {"type": "stat", "span": 4, "title": "Abuse reports filed (all-time)", "src": "pub_show_headline", "field": 0, "color": "blue", "fmt": "si"}, {"type": "stat", "span": 4, "title": "Phishing sites taken down (all-time)", "src": "pub_show_headline", "field": 1, "color": "green", "fmt": "si"}, {"type": "stat", "span": 4, "title": "Effective takedown rate", "src": "pub_show_headline", "field": 2, "color": "green", "fmt": "pct", "sub": "n = %N%", "subf": 3}, {"type": "stat", "span": 4, "title": "Median time-to-takedown", "src": "pub_show_headline", "field": 4, "color": "purple", "fmt": "dur"}, {"type": "stat", "span": 4, "title": "Providers &amp; registries engaged", "src": "pub_show_headline", "field": 5, "color": "orange", "fmt": "int"}, {"type": "stat", "span": 4, "title": "Days in continuous operation", "src": "pub_show_headline", "field": 6, "color": "blue", "fmt": "int"}, {"type": "line", "span": 12, "title": "Cumulative phishing sites taken down (all-time)", "src": "pub_show_cumulative", "x": 0, "y": 1, "color": "green", "fmt": "int", "label": "Cumulative sites removed", "tip": "Running total of distinct phishing sites confirmed removed after we reported them."}, {"type": "mline", "span": 12, "title": "Weekly reports filed, by outcome", "src": "pub_show_weekly_outcome", "x": 0, "series": [{"i": 1, "label": "Taken down", "color": "green"}, {"i": 2, "label": "Pending", "color": "blue"}, {"i": 3, "label": "Already dead", "color": "orange"}, {"i": 4, "label": "No action", "color": "red"}], "tip": "Abuse reports filed each week, split by outcome (taken down / pending / already dead / no action)."}, {"type": "line", "span": 6, "title": "Weekly effective takedown rate", "src": "pub_show_weekly_rate", "x": 0, "y": 1, "color": "green", "fmt": "pct", "label": "Effective rate", "tip": "Effective removal rate per week (excludes already-dead; the trailing ~2 weeks are omitted while still resolving)."}, {"type": "line", "span": 6, "title": "Weekly median time-to-takedown (h)", "src": "pub_show_weekly_ttd", "x": 0, "y": 1, "color": "purple", "fmt": "h1", "label": "Median TTD", "tip": "Median hours from filing a report to removal, per week (weeks with at least 5 takedowns)."}, {"type": "text", "span": 12, "html": "<h3>How the system works</h3><p>A fully automated pipeline we designed, built, and operate end-to-end:</p><ul><li><strong>Multi-source detection</strong> — ingests several public feeds and live-crawls to confirm a real, live phishing page.</li><li><strong>Cross-source corroboration</strong> — clusters across independent sources to suppress false positives before reporting.</li><li><strong>Enrichment</strong> — RDAP/WHOIS registrar intel, IP/hosting geolocation, favicon &amp; kit fingerprinting, MITRE ATT&amp;CK mapping.</li><li><strong>Predictive discovery</strong> — pivots on shared favicons and infrastructure to surface related phishing early.</li><li><strong>Automated abuse reporting</strong> — files structured reports to the correct host/registrar/registry and tracks each to a confirmed outcome.</li><li><strong>Liveness &amp; reconciliation</strong> — 2.8M+ status checks continuously verify whether targets are live, down, or rotated.</li></ul><p><strong>Stack:</strong> Python pipeline → SQLite intelligence store → self-hosted aggregates → this page.</p>"}, {"type": "text", "span": 12, "html": "<h1>The Threat Landscape We Monitor</h1><p>An aggregate, privacy-safe view of the phishing we track — how long scams survive, which brands are impersonated, where they're hosted, and how fast they're neutralized. No victim data, live links, or identifying details are shown.</p>"}, {"type": "stat", "span": 3, "title": "Phishing URLs observed (90d)", "src": "pub_eco_headline", "field": 0, "color": "blue", "fmt": "si"}, {"type": "stat", "span": 3, "title": "Taken down (90d)", "src": "pub_eco_headline", "field": 1, "color": "green", "fmt": "si"}, {"type": "stat", "span": 3, "title": "Effective takedown rate (90d)", "src": "pub_eco_headline", "field": 2, "color": "green", "fmt": "pct"}, {"type": "stat", "span": 3, "title": "Median time-to-takedown (90d)", "src": "pub_eco_headline", "field": 3, "color": "purple", "fmt": "dur"}, {"type": "line", "span": 8, "title": "Daily takedowns — 7-day rolling avg (90d)", "src": "pub_eco_daily_takedowns", "x": 0, "y": 2, "color": "green", "fmt": "int", "label": "7-day avg", "tip": "Distinct phishing URLs confirmed neutralised (dead / soft-404 / off-platform) each day, smoothed as a 7-day rolling average. The mid-July step-up reflects an ~8× expansion in detection intake, not a change in method."}, {"type": "hbar", "span": 4, "title": "Phishing survival curve (90d)", "src": "pub_eco_survival", "name": 0, "value": 1, "color": "green", "fmt": "pct", "tip": "Share of detected phishing still live N hours/days after first detection — lower is better."}, {"type": "hbar", "span": 6, "title": "Top targeted brands (30d)", "src": "pub_eco_top_brands", "name": 0, "value": 1, "color": "blue", "fmt": "si", "tip": "Brands impersonated most often, by distinct phishing URLs (last 30 days)."}, {"type": "hbar", "span": 6, "title": "Top hosting countries (30d)", "src": "pub_eco_top_countries", "name": 0, "value": 1, "color": "orange", "fmt": "si", "tip": "Countries hosting the most phishing, by distinct URLs. Hosting geography, not operator origin."}, {"type": "stack", "span": 6, "title": "Platform exposure — live vs taken down (30d)", "src": "pub_eco_platform_exposure", "name": 0, "a": 1, "b": 2, "aLabel": "Taken down", "bLabel": "Still live", "aColor": "green", "bColor": "red", "fmt": "si", "tip": "Per hosting platform: distinct URLs taken down vs still live (last 30 days)."}, {"type": "hbar", "span": 6, "title": "Median time-to-death by hosting platform (30d)", "src": "pub_eco_ttd_platform", "name": 0, "value": 1, "color": "orange", "fmt": "h1", "tip": "Median hours from detection to death, by hosting platform (platforms with 5+ samples)."}, {"type": "hbar", "span": 12, "namew": 320, "wrap": true, "title": "Attacker techniques — MITRE ATT&CK (30d)", "src": "pub_eco_mitre", "name": 0, "value": 1, "color": "purple", "fmt": "int", "tip": "MITRE ATT&CK techniques mapped across detections (last 30 days)."}, {"type": "geo", "span": 12, "title": "Phishing geographic distribution (30d)", "src": "pub_eco_geo", "tip": "Bubble size and color = distinct phishing URLs hosted in each country. Hover a bubble for its counts."}];

const G={green:'var(--green)',orange:'var(--orange)',blue:'var(--blue)',purple:'var(--purple)',red:'var(--red)'};
const fmtSI=n=>{n=+n;return n>=1e6?(n/1e6).toFixed(2)+' Mil':n>=1000?(n/1000).toFixed(2)+' K':''+n};
const fmt=(v,k)=>{v=+v;if(k==='si')return fmtSI(v);if(k==='pct')return (Number.isInteger(v)?v:v.toFixed(1))+'%';
 if(k==='dur')return v>=24?(v/24).toFixed(2)+' days':v.toFixed(1)+' h';if(k==='h1')return v.toFixed(1)+' h';
 if(k==='int')return v.toLocaleString();return ''+v};
const el=(h)=>{const t=document.createElement('template');t.innerHTML=h.trim();return t.content.firstChild};
function statVal(s,k){const f=fmt(s,k);const m=f.match(/^([\d.,]+)\s*(.*)$/);return m?`${m[1]}${m[2]?`<span class="u">${m[2]}</span>`:''}`:f}

function drawStat(p,D){const row=(D[p.src]||[[]])[0]||[];const v=row[p.field];
 const e=el(`<div class="panel stat g-${p.color}" style="grid-column:span ${p.span}"><div class="lbl">${p.title}</div>
  <div class="val">${statVal(v,p.fmt)}</div>${p.sub?`<div class="sub">${p.sub.replace('%N%',(row[p.subf]||0).toLocaleString())}</div>`:''}</div>`);return e}

function drawText(p){return el(`<div class="panel md" style="grid-column:span ${p.span}">${p.html}</div>`)}

function drawHbar(p,D){const rows=D[p.src]||[];const max=Math.max(1,...rows.map(r=>+r[p.value]));
 const body=rows.map((r,i)=>`<div class="row"><span class="name" title="${r[p.name]}">${r[p.name]}</span>
  <div class="track"><span class="fill" style="width:${(+r[p.value]/max*100).toFixed(1)}%;background:${G[p.color]};border-radius:2px;animation-delay:${i*.04}s"></span></div>
  <span class="num">${fmt(r[p.value],p.fmt)}</span></div>`).join('');
 return el(`<div class="panel" style="grid-column:span ${p.span}"><div class="head">${p.title}<span class="i" data-tip="${(p.tip||'').replace(/"/g,'&quot;')}">i</span></div><div class="body"><div class="hb${p.wrap?' wrap':''}" style="--namew:${p.namew||150}px">${body}</div></div></div>`)}

function drawStack(p,D){const rows=D[p.src]||[];const max=Math.max(1,...rows.map(r=>(+r[p.a])+(+r[p.b])));
 const body=rows.map((r,i)=>{const a=+r[p.a],b=+r[p.b],tot=a+b||1;
  return `<div class="row"><span class="name" title="${r[p.name]}">${r[p.name]}</span>
   <div class="track" style="width:${(tot/max*100).toFixed(1)}%">
    <span class="fill" style="width:${(a/tot*100).toFixed(1)}%;background:${G[p.aColor]};animation-delay:${i*.05}s"></span>
    <span class="fill" style="width:${(b/tot*100).toFixed(1)}%;background:${G[p.bColor]};animation-delay:${i*.05}s"></span>
   </div><span class="num">${fmt(tot,p.fmt)}</span></div>`}).join('');
 return el(`<div class="panel" style="grid-column:span ${p.span}"><div class="head">${p.title}<span class="i" data-tip="${(p.tip||'').replace(/"/g,'&quot;')}">i</span></div><div class="body">
  <div class="legend"><span><span class="k" style="background:${G[p.aColor]}"></span>${p.aLabel}</span><span><span class="k" style="background:${G[p.bColor]}"></span>${p.bLabel}</span></div>
  <div class="hb" style="padding-top:8px">${body}</div></div></div>`)}

function xticks(rows,xi){const n=rows.length;const idx=[0,Math.floor(n/3),Math.floor(2*n/3),n-1];
 return [...new Set(idx)].map(i=>({i,label:String(rows[i][xi]).slice(0,10).slice(5)}))}

function drawLine(p,D){const rows=D[p.src]||[];if(!rows.length)return el(`<div class="panel" style="grid-column:span ${p.span}"><div class="head">${p.title}</div><div class="body"></div></div>`);
 const W=760,H=200,pad={l:40,r:12,t:10,b:22},iw=W-pad.l-pad.r,ih=H-pad.t-pad.b;
 const ys=rows.map(r=>+r[p.y]);const max=Math.max(1,...ys)*1.08;
 const x=i=>pad.l+iw*i/(rows.length-1||1),y=v=>pad.t+ih*(1-v/max);
 let d='M'+x(0)+' '+y(ys[0]);ys.forEach((v,i)=>d+=' L'+x(i).toFixed(1)+' '+y(v).toFixed(1));
 const area=d+` L${x(rows.length-1)} ${pad.t+ih} L${x(0)} ${pad.t+ih} Z`;
 let gl='';for(let g=0;g<=3;g++){const gy=pad.t+ih*g/3,gv=max*(1-g/3);gl+=`<line x1="${pad.l}" x2="${W-pad.r}" y1="${gy}" y2="${gy}" stroke="var(--grid)"/><text x="4" y="${gy+3}" class="axis">${fmt(Math.round(gv),p.fmt)}</text>`}
 let xl='';xticks(rows,p.x).forEach(t=>xl+=`<text x="${x(t.i)}" y="${H-6}" class="axis" text-anchor="middle">${t.label}</text>`);
 const gid='ar'+Math.abs([...p.title].reduce((a,c)=>a*31+c.charCodeAt(0)|0,7));
 return el(`<div class="panel" style="grid-column:span ${p.span}"><div class="head">${p.title}<span class="i" data-tip="${(p.tip||'').replace(/"/g,'&quot;')}">i</span></div><div class="body">
  <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="height:210px">
   <defs><linearGradient id="${gid}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${G[p.color]}" stop-opacity=".32"/><stop offset="1" stop-color="${G[p.color]}" stop-opacity="0"/></linearGradient></defs>
   ${gl}${xl}<path d="${area}" fill="url(#${gid})"/><path d="${d}" fill="none" stroke="${G[p.color]}" stroke-width="2"/>
   <circle cx="${x(rows.length-1)}" cy="${y(ys[ys.length-1])}" r="3.2" fill="${G[p.color]}"/></svg>
  <div class="legend"><span><span class="k" style="background:${G[p.color]}"></span>${p.label} &nbsp;<strong style="color:var(--text)">${fmt(ys[ys.length-1],p.fmt)}</strong></span></div></div></div>`)}

function drawMline(p,D){const rows=D[p.src]||[];const W=760,H=200,pad={l:40,r:12,t:10,b:22},iw=W-pad.l-pad.r,ih=H-pad.t-pad.b;
 let max=1;rows.forEach(r=>p.series.forEach(s=>max=Math.max(max,+r[s.i])));max*=1.1;
 const x=i=>pad.l+iw*i/(rows.length-1||1),y=v=>pad.t+ih*(1-v/max);
 let gl='';for(let g=0;g<=3;g++){const gy=pad.t+ih*g/3;gl+=`<line x1="${pad.l}" x2="${W-pad.r}" y1="${gy}" y2="${gy}" stroke="var(--grid)"/><text x="4" y="${gy+3}" class="axis">${Math.round(max*(1-g/3))}</text>`}
 let xl='';xticks(rows,p.x).forEach(t=>xl+=`<text x="${x(t.i)}" y="${H-6}" class="axis" text-anchor="middle">${t.label}</text>`);
 let paths='',leg='';p.series.forEach(s=>{let d='M'+x(0)+' '+y(+rows[0][s.i]);rows.forEach((r,i)=>d+=' L'+x(i).toFixed(1)+' '+y(+r[s.i]).toFixed(1));
  paths+=`<path d="${d}" fill="none" stroke="${G[s.color]}" stroke-width="2"/>`;leg+=`<span><span class="k" style="background:${G[s.color]}"></span>${s.label}</span>`});
 return el(`<div class="panel" style="grid-column:span ${p.span}"><div class="head">${p.title}<span class="i" data-tip="${(p.tip||'').replace(/"/g,'&quot;')}">i</span></div><div class="body">
  <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="height:210px">${gl}${xl}${paths}</svg>
  <div class="legend">${leg}</div></div></div>`)}

function drawGeo(p,D){const rows=D[p.src]||[];const W=760,H=340,pad=14,iw=W-2*pad,ih=H-2*pad;
 const proj=(lon,lat)=>[pad+(lon+180)/360*iw, pad+(90-lat)/180*ih];
 const max=Math.max(1,...rows.map(r=>+r[3]));
 let grat='';for(let lon=-150;lon<=150;lon+=30){const[gx]=proj(lon,0);grat+=`<line x1="${gx}" x2="${gx}" y1="${pad}" y2="${H-pad}" stroke="var(--grid)"/>`}
 for(let lat=-60;lat<=60;lat+=30){const[,gy]=proj(0,lat);grat+=`<line x1="${pad}" x2="${W-pad}" y1="${gy}" y2="${gy}" stroke="var(--grid)"/>`}
 const[,eqy]=proj(0,0);grat+=`<line x1="${pad}" x2="${W-pad}" y1="${eqy}" y2="${eqy}" stroke="rgba(204,204,220,.16)"/>`;
 const REG=[['NORTH AMERICA',-100,48],['SOUTH AMERICA',-58,-14],['EUROPE',16,56],['AFRICA',20,2],['ASIA',96,50],['OCEANIA',140,-27]];
 let reg='';REG.forEach(a=>{const[rx,ry]=proj(a[1],a[2]);reg+=`<text x="${rx.toFixed(0)}" y="${ry.toFixed(0)}" text-anchor="middle" fill="rgba(204,204,220,.10)" font-size="12.5" font-weight="700" letter-spacing="1.4">${a[0]}</text>`});
 const sorted=[...rows].sort((a,b)=>b[3]-a[3]);let bub='',lbl='';
 sorted.forEach((r,i)=>{const[cx,cy]=proj(+r[2],+r[1]);const rad=3+Math.sqrt(+r[3]/max)*20;
  const t=+r[3]/max;const col=t>.5?'var(--red)':t>.2?'var(--orange)':'var(--yellow)';
  bub+=`<circle cx="${cx.toFixed(0)}" cy="${cy.toFixed(0)}" r="${rad.toFixed(1)}" fill="${col}" fill-opacity=".55" stroke="${col}" stroke-width="1" data-c="${r[0]}" data-u="${+r[3]}" data-l="${+r[4]}"></circle>`;
  if(i<7)lbl+=`<text class="geo-lbl" x="${(cx+rad+3).toFixed(0)}" y="${(cy+3).toFixed(0)}">${r[0]}</text>`});
 const e=el(`<div class="panel geowrap" style="grid-column:span ${p.span}"><div class="head">${p.title}<span class="i" data-tip="${(p.tip||'').replace(/"/g,'&quot;')}">i</span></div><div class="body">
  <svg viewBox="0 0 ${W} ${H}" style="height:340px">${grat}${reg}${bub}${lbl}</svg>
  <div class="geo-tip"></div>
  <div class="legend"><span>Bubble size &amp; color = distinct phishing URLs hosted in that country (last 30d). Equirectangular; hosting geography, not operator origin.</span></div></div></div>`);
 const tip=e.querySelector('.geo-tip');
 e.querySelectorAll('circle').forEach(ci=>{
  ci.addEventListener('pointerenter',()=>{tip.innerHTML=`<div class="c">${ci.dataset.c}</div><div class="r"><b>${(+ci.dataset.u).toLocaleString()}</b> URLs &middot; <b>${(+ci.dataset.l).toLocaleString()}</b> still live</div>`;tip.classList.add('on')});
  ci.addEventListener('pointermove',ev=>{const rc=e.getBoundingClientRect();tip.style.left=(ev.clientX-rc.left)+'px';tip.style.top=(ev.clientY-rc.top)+'px'});
  ci.addEventListener('pointerleave',()=>tip.classList.remove('on'))});
 return e}

const DRAW={text:drawText,stat:drawStat,hbar:drawHbar,stack:drawStack,line:drawLine,mline:drawMline,geo:drawGeo};
function render(D,PANELS){const g=document.getElementById('grid');PANELS.forEach(p=>{try{g.appendChild(DRAW[p.type](p,D))}catch(e){console.error(p,e)}})}
// styled tooltip for the panel ⓘ icons — delegated, one shared element, cursor-following
(function(){const tip=document.createElement('div');tip.className='itip';document.body.appendChild(tip);
 const near=t=>t&&t.closest?t.closest('.i[data-tip]'):null;
 document.addEventListener('pointerover',e=>{const t=near(e.target);if(t&&t.dataset.tip){tip.textContent=t.dataset.tip;tip.classList.add('on');}});
 document.addEventListener('pointermove',e=>{if(tip.classList.contains('on')){tip.style.left=e.clientX+'px';tip.style.top=e.clientY+'px';}});
 document.addEventListener('pointerout',e=>{if(near(e.target))tip.classList.remove('on');});})();

render(DATA,PANELS);
</script>
</body>
</html>
