:root{--bg:#111217;--panel:#181b1f;--border:rgba(204,204,220,.07);--border2:rgba(204,204,220,.14);

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:13px;line-height:1.45;
-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
/* sticky: these pages are embedded in an iframe and read by scrolling, so a stamp
   that only exists above the fold is a stamp nobody sees. */
.topbar{display:flex;align-items:center;gap:10px;height:40px;padding:0 16px;background:var(--topbar);
border-bottom:1px solid var(--border);font-size:13px;color:var(--weak);
position:sticky;top:0;z-index:20}
.topbar .crumb{color:var(--title);font-weight:500}.topbar .crumb .sep{color:var(--faint);margin:0 7px}
.topbar .spacer{flex:1}.topbar .stamp{color:var(--faint);font-size:12px;white-space:nowrap}
.foot{color:var(--faint);font-size:11px;padding:14px 8px 18px;text-align:center;
border-top:1px solid var(--border);margin-top:10px}
.foot b{color:var(--weak);font-weight:500}
/* per-panel window label — states the exact span each chart covers, because the
   lag, the weekly bucketing and the rate hold-back give them different end dates. */
.panel>.head .through{color:var(--faint);font-size:11px;font-weight:400;margin-left:auto;
padding-left:10px;white-space:nowrap;flex:none;order:2}
.wrap{padding:8px;max-width:1600px;margin:0 auto}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:8px}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:3px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.panel>.head{padding:7px 10px 4px;font-size:13px;font-weight:500;color:var(--title);display:flex;align-items:center;gap:6px}
/* The date range carries margin-left:auto, which pushes itself AND every sibling
   after it to the right edge - so the tip icon, emitted after the title, ended up
   marooned next to the date instead of beside the header it explains. Reorder with
   flex `order`: the bare title text is an anonymous flex item and defaults to 0, so
   giving the icon 1 and the range 2 seats the icon against the title without
   touching any renderer. Reordering the title itself would not work - `order` has
   no effect on an anonymous item. */
.panel>.head .i{width:13px;height:13px;border:1px solid var(--faint);border-radius:50%;color:var(--faint);
font-size:9px;line-height:11px;text-align:center;font-weight:700;flex:none;order:1}
.panel>.body{padding:6px 10px 12px;flex:1;min-height:0}
.md{background:var(--panel);border:1px solid var(--border);border-radius:3px;padding:14px 18px}
.md h1{font-size:20px;font-weight:500;color:#fff;margin:0 0 6px;letter-spacing:.2px;text-wrap:balance}
.md h3{font-size:15px;font-weight:600;color:var(--title);margin:0 0 8px}
.md p{margin:0 0 6px;color:var(--weak);max-width:118ch;font-size:13px;line-height:1.55}
.md ul{margin:2px 0 0;padding-left:18px;color:var(--weak);columns:2;column-gap:32px}
.md li{margin:0 0 4px;break-inside:avoid}.md strong{color:var(--text);font-weight:600}.md em{color:var(--faint)}
.stat{position:relative;color:#fff;justify-content:space-between;min-height:88px}
.stat .lbl{font-size:12.5px;font-weight:500;opacity:.92;padding:9px 12px 0}
.stat .val{font-weight:500;letter-spacing:-.5px;padding:0 12px 12px;font-size:clamp(24px,2.7vw,40px);line-height:1.05;white-space:nowrap}
.stat .val .u{font-size:.5em;font-weight:400;opacity:.85;margin-left:3px}
.stat .sub{position:absolute;right:12px;bottom:13px;font-size:11px;opacity:.8;font-weight:400}
.g-green{background:linear-gradient(120deg,var(--green),var(--green-d))}
.g-orange{background:linear-gradient(120deg,var(--orange),var(--orange-d))}
.g-blue{background:linear-gradient(120deg,var(--blue),var(--blue-d))}
.g-purple{background:linear-gradient(120deg,var(--purple),var(--purple-d))}
svg{display:block;width:100%}.axis{fill:var(--faint);font-size:10px}
.legend{display:flex;gap:14px;padding:2px 4px 0;font-size:11px;color:var(--weak);flex-wrap:wrap}
.pnote{color:var(--weak);font-size:11.5px;line-height:1.45;padding:2px 4px 8px;border-bottom:1px solid var(--grid);margin-bottom:6px}
.legend .k{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.hb{display:flex;flex-direction:column;gap:8px;padding-top:4px}
.hb .row{display:grid;grid-template-columns:var(--namew,150px) 1fr auto;align-items:center;gap:10px;font-size:12px}
.hb .row .name{color:var(--weak);text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb.wrap .row .name{white-space:normal;overflow:visible;text-overflow:clip;line-height:1.2}
.hb .track{height:19px;background:rgba(204,204,220,.05);border-radius:2px;overflow:hidden;display:flex}
.hb .fill{height:100%;transform-origin:left;animation:grow .7s cubic-bezier(.2,.7,.3,1) both}
.hb .num{color:var(--text);font-weight:500;min-width:56px;text-align:right}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@media (prefers-reduced-motion:reduce){.hb .fill{animation:none}}
.geowrap{position:relative}.geo-lbl{fill:var(--text);font-size:10px;paint-order:stroke;stroke:var(--panel);stroke-width:3px}
.geowrap circle{cursor:default;transition:fill-opacity .1s}.geowrap circle:hover{fill-opacity:.85}
.geo-tip{position:absolute;left:0;top:0;pointer-events:none;z-index:6;background:#0b0e14;border:1px solid var(--border2);
 border-radius:4px;padding:6px 10px;font-size:12px;line-height:1.35;color:var(--text);box-shadow:0 6px 20px rgba(0,0,0,.55);
 white-space:nowrap;transform:translate(-50%,calc(-100% - 13px));opacity:0;transition:opacity .09s}
.geo-tip.on{opacity:1}.geo-tip .c{font-weight:600;color:#fff;margin-bottom:1px}
.geo-tip .r{color:var(--weak)}.geo-tip .r b{color:var(--text);font-weight:600}
.panel>.head .i[data-tip]{cursor:help}
.itip.anchored{max-width:min(86vw,420px)}
@media(max-width:600px){.panel>.head .i{width:17px;height:17px;font-size:11px;
 line-height:15px}}  /* a 13px circle is under the 24px touch-target floor */
.itip{position:fixed;left:0;top:0;pointer-events:none;z-index:30;max-width:280px;background:#0b0e14;
 border:1px solid var(--border2);border-radius:4px;padding:7px 10px;font-size:12px;line-height:1.4;color:var(--text);
 box-shadow:0 6px 20px rgba(0,0,0,.55);opacity:0;transition:opacity .09s}
.itip.on{opacity:1}
.note{color:var(--faint);font-size:11px;padding:12px 8px 6px;text-align:center}
.note code{color:var(--weak)}
/* Do NOT change the track count on small screens. Every panel's span is authored
   against a 12-column basis, so a 6-track grid makes each `span 12` panel force
   six IMPLICIT tracks: the six real columns collapse to 0px and content lands in
   ragged implicit ones. Measured at 390px before this fix:
     COLS = 0 0 0 0 0 0 108.9 108.9 40.8 40.8 40.8 40.8
   which rendered two stat tiles at 24px and a chart at 40px.
   Keep 12 tracks at every width and re-span the ITEMS instead. Spans are inline
   styles, so overriding them needs !important — this is the documented case for
   it, not a shortcut. */
@media(max-width:900px){
 .grid>[style*="span 4"]{grid-column:span 6!important}
 .grid>[style*="span 6"]{grid-column:span 12!important}
 .hb .row{grid-template-columns:100px 1fr auto}.md ul{columns:1}}
@media(max-width:600px){
 .grid>*{grid-column:span 12!important}
 /* panels flagged mobile:"hide" - see render() */
 .grid>[data-mobile="hide"]{display:none}
 /* the date range is secondary; on a phone it steals the title's line */
 .panel>.head .through{display:none}

    renders at ~5px. Bump it in viewBox units to land near 9-10px on screen. */
 svg .axis{font-size:19px}
 .legend{font-size:12px}}

const PANELS=[{"type": "stat", "span": 3, "title": "Phishing URLs observed (90d)", "src": "pub_eco_headline", "field": 0, "color": "blue", "fmt": "si"}, {"type": "stat", "span": 3, "title": "Went offline (90d) — all causes", "src": "pub_eco_headline", "field": 1, "color": "green", "fmt": "si"}, {"type": "stat", "span": 3, "title": "Share that went offline (90d) — of phishing seen live", "src": "pub_eco_headline", "field": 2, "color": "green", "fmt": "pct"}, {"type": "stat", "span": 3, "title": "Median time from our report to removal (90d)", "src": "pub_eco_headline", "field": 3, "color": "purple", "fmt": "dur"}, {"type": "line", "span": 8, "title": "Phishing going offline per day — 7-day rolling avg (90d)<span class=\"through\">2026-06-21 → 2026-09-19</span>", "src": "pub_eco_daily_takedowns", "x": 0, "y": 2, "color": "green", "fmt": "int", "label": "7-day avg", "tip": "Distinct phishing URLs we watched go offline each day, smoothed as a 7-day rolling average. A URL counts on the day our probes first found it gone (dead, soft-404, parked, or redirecting off-platform) after having seen it live - a name we recorded but never saw serve a page is not counted, because it never went offline. ALL CAUSES: operator abandonment, the host's own action, other reporters, and us. Most phishing dies without anyone reporting it, so this is a picture of the ecosystem, not of our impact; what we can attribute to our own reports is reported separately and is a small fraction of this."}, {"type": "hbar", "span": 4, "title": "Phishing survival curve (90d)", "src": "pub_eco_survival", "name": 0, "value": 1, "color": "green", "fmt": "pct", "tip": "Of the phishing we observed live, the share still live N hours/days after first detection — lower is better."}, {"type": "hbar", "span": 6, "title": "Top targeted brands (30d)", "src": "pub_eco_top_brands", "name": 0, "value": 1, "color": "blue", "fmt": "si", "tip": "Brands impersonated most often, by distinct phishing URLs (last 30 days)."}, {"type": "hbar", "span": 6, "title": "Top hosting countries (30d)", "src": "pub_eco_top_countries", "name": 0, "value": 1, "color": "orange", "fmt": "si", "tip": "Countries hosting the most phishing, by distinct URLs. Hosting geography, not operator origin."}, {"type": "stack", "span": 6, "title": "Platform exposure — went offline vs still live (30d, identifiable hosts)", "src": "pub_eco_platform_exposure", "name": 0, "a": 1, "b": 2, "aLabel": "Went offline", "bLabel": "Still live", "aColor": "green", "bColor": "red", "fmt": "si", "noteSrc": "pub_eco_proxy_context", "note": "A further %A% of %B% URLs (%P%%) sat behind Cloudflare's proxy, which fronts an origin host rather than serving the content itself — counted separately so the hosts below stay readable.", "tip": "Per hosting platform: distinct URLs now offline vs still live, first seen in the last 30 days. 'Went offline' counts only pages we saw live and then saw go, and it is ALL-CAUSE - operator abandonment, the host's own action and other reporters included - so it is deliberately not called a takedown rate. Cloudflare is stated above the bars rather than charted among them: it is a reverse proxy that fronts an origin host rather than serving the content itself, and at ~92% of the window it compressed every real host into a couple of pixels. Detections whose platform could not be identified are excluded - that bucket is larger than every named platform combined, and charting a placeholder as though it were a hosting provider would say nothing while hiding the ones that do."}, {"type": "hbar", "span": 6, "title": "How fast phishing dies by platform (30d) — all causes, not provider response", "src": "pub_eco_ttd_platform", "name": 0, "value": 1, "color": "orange", "fmt": "h1", "tip": "Median hours from our first detection to the site going offline, by platform, over pages we observed live. ALL CAUSES: the operator walking away, the platform's own sweeps, an ephemeral deployment expiring, someone else reporting it, or us. It never looks at abuse reports, so it is NOT a ranking of how well a platform responds when you report to it.\n\nThe difference is not academic. A platform can top this chart because its infrastructure is short-lived by design - preview deployments that expire on their own - while its abuse desk sits on hundreds of unanswered reports. Another can look slow here and action nearly everything sent to it. Provider responsiveness is a separate measurement and is reported separately."}, {"type": "hbar", "span": 12, "namew": 320, "wrap": true, "title": "Attacker techniques — MITRE ATT&CK (30d)", "src": "pub_eco_mitre", "name": 0, "value": 1, "color": "purple", "fmt": "int", "tip": "MITRE ATT&CK techniques mapped across detections (last 30 days)."}, {"type": "geo", "span": 12, "title": "Phishing geographic distribution (30d)", "src": "pub_eco_geo", "mobile": "hide", "tip": "Bubble size and color = distinct phishing URLs hosted in each country. Hover a bubble for its counts."}, {"type": "text", "span": 12, "html": "<div style=\"text-align:center;padding:8px 0 2px\"><a href=\"https://heftyotter333.grafana.net/public-dashboards/f6c9fec63d7a42adbbfabdb39ffe2e03\" target=\"_blank\" rel=\"noopener\" style=\"display:inline-block;background:linear-gradient(120deg,#ff9830,#e0752d);color:#161616;font-weight:700;text-decoration:none;padding:11px 24px;border-radius:7px;font-size:14.5px;font-family:Roboto,Arial,sans-serif\">View the live interactive dashboard &rarr;</a></div>"}];

const G={green:'var(--green)',orange:'var(--orange)',blue:'var(--blue)',purple:'var(--purple)',red:'var(--red)'};
const fmtSI=n=>{n=+n;return n>=1e6?(n/1e6).toFixed(2)+' Mil':n>=1000?(n/1000).toFixed(2)+' K':''+n};
const fmt=(v,k)=>{v=+v;if(k==='si')return fmtSI(v);if(k==='pct')return (Number.isInteger(v)?v:v.toFixed(1))+'%';

 const e=el(`<div class="panel stat g-${p.color}" style="grid-column:span ${p.span}"><div class="lbl">${p.title}</div>

function drawText(p){return el(`<div class="panel md" style="grid-column:span ${p.span}">${p.html}</div>`)}

 return el(`<div class="panel" style="grid-column:span ${p.span}"><div class="head">${p.title}<span class="i" data-tip="${(p.tip||'').replace(/"/g,'&quot;')}">i</span></div><div class="body"><div class="hb${p.wrap?' wrap':''}" style="--namew:${p.namew||150}px">${body}</div></div></div>`)}

 let d='M'+x(0)+' '+y(ys[0]);ys.forEach((v,i)=>d+=' L'+x(i).toFixed(1)+' '+y(v).toFixed(1));
 const area=d+` L${x(rows.length-1)} ${pad.t+ih} L${x(0)} ${pad.t+ih} Z`;
 let gl='';for(let g=0;g<=3;g++){const gy=pad.t+ih*g/3,gv=max*(1-g/3);gl+=`<line x1="${pad.l}" x2="${W-pad.r}" y1="${gy}" y2="${gy}" stroke="var(--grid)"/><text x="4" y="${gy+3}" class="axis">${fmt(Math.round(gv),p.fmt)}</text>`}
 const anch=i=>i===0?'start':(i>=rows.length-1?'end':'middle');
 let xl='';xticks(rows,p.x).forEach(t=>xl+=`<text x="${x(t.i)}" y="${H-6}" class="axis" text-anchor="${anch(t.i)}">${t.label}</text>`);
 const gid='ar'+Math.abs([...p.title].reduce((a,c)=>a*31+c.charCodeAt(0)|0,7));
 return el(`<div class="panel" style="grid-column:span ${p.span}"><div class="head">${p.title}<span class="i" data-tip="${(p.tip||'').replace(/"/g,'&quot;')}">i</span></div><div class="body">
  <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="height:210px">
   <defs><linearGradient id="${gid}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${G[p.color]}" stop-opacity=".32"/><stop offset="1" stop-color="${G[p.color]}" stop-opacity="0"/></linearGradient></defs>
   ${gl}${xl}<path d="${area}" fill="url(#${gid})"/><path d="${d}" fill="none" stroke="${G[p.color]}" stroke-width="2"/>
   <circle cx="${x(rows.length-1)}" cy="${y(ys[ys.length-1])}" r="3.2" fill="${G[p.color]}"/></svg>
  <div class="legend"><span><span class="k" style="background:${G[p.color]}"></span>${p.label} &nbsp;<strong style="color:var(--text)">${fmt(ys[ys.length-1],p.fmt)}</strong></span></div></div></div>`)}

function drawMline(p,D){const W=760,H=200,pad={l:40,r:12,t:10,b:22},iw=W-pad.l-pad.r,ih=H-pad.t-pad.b;
 const maps=p.series.map(s=>{const m={};(D[s.src||p.src]||[]).forEach(r=>{const v=r[s.i];if(v!==null&&v!==undefined&&v!=='')m[String(r[p.x])]=+v});return m});
 const keys=[...new Set(maps.flatMap(m=>Object.keys(m)))].sort();
 if(!keys.length)return el(`<div class="panel" style="grid-column:span ${p.span}"><div class="head">${p.title}</div><div class="body"></div></div>`);
 let max=1;maps.forEach(m=>Object.values(m).forEach(v=>max=Math.max(max,v)));max*=1.1;
 const x=i=>pad.l+iw*i/(keys.length-1||1),y=v=>pad.t+ih*(1-v/max);
 let gl='';for(let g=0;g<=3;g++){const gy=pad.t+ih*g/3;gl+=`<line x1="${pad.l}" x2="${W-pad.r}" y1="${gy}" y2="${gy}" stroke="var(--grid)"/><text x="4" y="${gy+3}" class="axis">${Math.round(max*(1-g/3))}</text>`}
 const anch=i=>i===0?'start':(i>=keys.length-1?'end':'middle');
 let xl='';xticks(keys.map(k=>[k]),0).forEach(t=>xl+=`<text x="${x(t.i)}" y="${H-6}" class="axis" text-anchor="${anch(t.i)}">${t.label}</text>`);
 let paths='',leg='';p.series.forEach((s,si)=>{const m=maps[si];let d='',pen=false;
  keys.forEach((k,i)=>{const v=m[k];if(v===undefined){pen=false;return}d+=(pen?' L':' M')+x(i).toFixed(1)+' '+y(v).toFixed(1);pen=true});
  if(d)paths+=`<path d="${d}" fill="none" stroke="${G[s.color]}" stroke-width="2"/>`;
  leg+=`<span><span class="k" style="background:${G[s.color]}"></span>${s.label}</span>`});
 return el(`<div class="panel" style="grid-column:span ${p.span}"><div class="head">${p.title}<span class="i" data-tip="${(p.tip||'').replace(/"/g,'&quot;')}">i</span></div><div class="body">
  <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="height:210px">${gl}${xl}${paths}</svg>
  <div class="legend">${leg}</div></div></div>`)}

function drawGeo(p,D){const rows=D[p.src]||[];const W=760,H=340,pad=14,iw=W-2*pad,ih=H-2*pad;
 const proj=(lon,lat)=>[pad+(lon+180)/360*iw, pad+(90-lat)/180*ih];
 const max=Math.max(1,...rows.map(r=>+r[3]));
 // LAND is in degrees (x=lon, y=-lat); this affine map is proj() as a transform,
 // so the outline follows W/H/pad without being regenerated. Fill only — a stroke
 // would be scaled anisotropically by it.
 const sx=iw/360,sy=ih/180,land=LAND?`<path d="${LAND}" transform="translate(${(pad+180*sx).toFixed(2)} ${(pad+90*sy).toFixed(2)}) scale(${sx.toFixed(4)} ${sy.toFixed(4)})" fill="rgba(204,204,220,.075)"/>`:'';
 let grat='';for(let lon=-150;lon<=150;lon+=30){const[gx]=proj(lon,0);grat+=`<line x1="${gx}" x2="${gx}" y1="${pad}" y2="${H-pad}" stroke="var(--grid)"/>`}
 for(let lat=-60;lat<=60;lat+=30){const[,gy]=proj(0,lat);grat+=`<line x1="${pad}" x2="${W-pad}" y1="${gy}" y2="${gy}" stroke="var(--grid)"/>`}
 const[,eqy]=proj(0,0);grat+=`<line x1="${pad}" x2="${W-pad}" y1="${eqy}" y2="${eqy}" stroke="rgba(204,204,220,.16)"/>`;
 const REG=[['NORTH AMERICA',-100,48],['SOUTH AMERICA',-58,-14],['EUROPE',16,56],['AFRICA',20,2],['ASIA',96,50],['OCEANIA',140,-27]];
 let reg='';REG.forEach(a=>{const[rx,ry]=proj(a[1],a[2]);reg+=`<text x="${rx.toFixed(0)}" y="${ry.toFixed(0)}" text-anchor="middle" fill="rgba(204,204,220,.10)" font-size="12.5" font-weight="700" letter-spacing="1.4">${a[0]}</text>`});
 const sorted=[...rows].sort((a,b)=>b[3]-a[3]);let bub='',lbl='';
 sorted.forEach((r,i)=>{const[cx,cy]=proj(+r[2],+r[1]);const rad=3+Math.sqrt(+r[3]/max)*20;
  const t=+r[3]/max;const col=t>.5?'var(--red)':t>.2?'var(--orange)':'var(--yellow)';
  bub+=`<circle cx="${cx.toFixed(0)}" cy="${cy.toFixed(0)}" r="${rad.toFixed(1)}" fill="${col}" fill-opacity=".55" stroke="${col}" stroke-width="1" data-c="${r[0]}" data-u="${+r[3]}" data-l="${+r[4]}"></circle>`;
  if(i<7)lbl+=`<text class="geo-lbl" x="${(cx+rad+3).toFixed(0)}" y="${(cy+3).toFixed(0)}">${r[0]}</text>`});
 const e=el(`<div class="panel geowrap" style="grid-column:span ${p.span}"><div class="head">${p.title}<span class="i" data-tip="${(p.tip||'').replace(/"/g,'&quot;')}">i</span></div><div class="body">
  <svg viewBox="0 0 ${W} ${H}" style="height:340px">${land}${grat}${reg}${bub}${lbl}</svg>
  <div class="geo-tip"></div>
  <div class="legend"><span>Bubble size &amp; color = distinct phishing URLs hosted in that country (last 30d). Equirectangular; hosting geography, not operator origin.</span></div></div></div>`);
 const tip=e.querySelector('.geo-tip');
 e.querySelectorAll('circle').forEach(ci=>{
  ci.addEventListener('pointerenter',()=>{tip.innerHTML=`<div class="c">${ci.dataset.c}</div><div class="r"><b>${(+ci.dataset.u).toLocaleString()}</b> URLs &middot; <b>${(+ci.dataset.l).toLocaleString()}</b> still live</div>`;tip.classList.add('on')});
  ci.addEventListener('pointermove',ev=>{const rc=e.getBoundingClientRect();tip.style.left=(ev.clientX-rc.left)+'px';tip.style.top=(ev.clientY-rc.top)+'px'});
  ci.addEventListener('pointerleave',()=>tip.classList.remove('on'))});
 return e}

const DRAW={hero:drawHero,activity:drawActivity,funnel:drawFunnel,text:drawText,stat:drawStat,hbar:drawHbar,stack:drawStack,line:drawLine,mline:drawMline,geo:drawGeo};
// A panel may carry mobile:"hide". Stamped here rather than in each renderer so
// it works for every panel type, including ones added later. Note this hides with
// CSS, so the panel's data is still in the page payload - the saving is screen
// space and scroll length, not bytes. It is also live: rotating a phone into
// landscape past the breakpoint brings the panel back, which a render-time skip
// would not do.
function render(D,PANELS){const g=document.getElementById('grid');PANELS.forEach(p=>{try{
 const el=DRAW[p.type](p,D);
 if(p.mobile)el.dataset.mobile=p.mobile;
 g.appendChild(el)}catch(e){console.error(p,e)}})}
// styled tooltip for the panel ⓘ icons — delegated, one shared element, cursor-following
(function(){const tip=document.createElement('div');tip.className='itip';document.body.appendChild(tip);
 const near=t=>t&&t.closest?t.closest('.i[data-tip]'):null;
 // Keep the whole box on screen. It used to be centred on the cursor with
 // transform:translate(-50%,...), which cannot be clamped — so an icon at the
 // left edge of a panel header (e.g. "Live activity") had its tooltip's left
 // half rendered off-viewport and the first words were unreadable.
 // Preference is above-centred; it falls below when there is no room above,
 // and slides horizontally rather than overflowing either edge.
 function place(x,y,below){const m=10,w=tip.offsetWidth,h=tip.offsetHeight;
  const L=Math.min(Math.max(x-w/2,m),Math.max(m,window.innerWidth-w-m));
  let T=below?y+10:y-h-12;
  if(T<m)T=y+10;                                  // no room above -> go below
  if(T+h>window.innerHeight-m)T=Math.max(m,y-h-12); // none below either -> above
  tip.style.left=L+'px';tip.style.top=T+'px';}
 document.addEventListener('pointerover',e=>{const t=near(e.target);if(t&&t.dataset.tip){
   tip.textContent=t.dataset.tip;tip.classList.add('on');
   const r=t.getBoundingClientRect();place(r.left+r.width/2,r.top);}});
 document.addEventListener('pointermove',e=>{if(tip.classList.contains('on')&&!tip.classList.contains('anchored'))place(e.clientX,e.clientY);});
 document.addEventListener('pointerout',e=>{if(e.pointerType==='mouse'&&near(e.target))tip.classList.remove('on');});
 // Touch has no hover and no cursor for a cursor-following tooltip to follow, so
 // the icons were inert on mobile. Tap toggles instead, anchored to the icon;
 // tapping anywhere else dismisses.
 document.addEventListener('click',e=>{const t=near(e.target);
  if(!t){tip.classList.remove('on','anchored');return}
  e.preventDefault();e.stopPropagation();
  if(tip.classList.contains('on')&&tip.dataset.for===t.dataset.tip){
    tip.classList.remove('on','anchored');return}
  const r=t.getBoundingClientRect();
  tip.textContent=t.dataset.tip;tip.dataset.for=t.dataset.tip;
  tip.classList.add('on','anchored');
  place(r.left+r.width/2, r.bottom, true);},true);})();

// -- redesign 2026-08-24 -----------------------------------------------------
// hero: the scoreboard directly under the headline, larger than a stat tile
// because these are the first numbers a visitor should read.
// An item may name its own `src`, the way a drawMline series does. The hero
// mixes two tables on purpose: the takedown cell reads pub_show_headline so it
// is the SAME query as the homepage teaser rather than a second one that merely
// agrees today -- pub_scoreboard's equivalent also accepts
// takedown_confirmed_via_urlhaus, and the 28 such rows contribute nothing only
// because each already carries a taken_down row beside it.
function drawHero(p,D){
 const cells=p.items.map(it=>{const row=(D[it.src||p.src]||[[]])[0]||[];
  const v=(it.lit!==undefined)?it.lit:fmt(row[it.field],it.fmt);
  return `<div class="hcell"><div class="hval hx-${it.color}">${v}</div><div class="hlbl">${it.label}</div></div>`}).join('');
 return el(`<div class="panel hero" style="grid-column:span ${p.span}">${cells}</div>`)}
// activity: sanitised recent events. No URL, domain, IP, ASN, operator handle or
// webhook exists in this data - see publish_public_stats.pub_live_activity.
function drawActivity(p,D){const rows=D[p.src]||[];
 const ago=t=>{const s=(Date.now()-Date.parse(String(t).replace(' ','T')+'Z'))/1000;
  if(!isFinite(s)||s<0)return'just now';
  if(s<90)return Math.max(1,Math.round(s))+' seconds ago';
  if(s<5400)return Math.round(s/60)+' minutes ago';
  if(s<172800)return Math.round(s/3600)+' hours ago';
  return Math.round(s/86400)+' days ago'};
 const K={DETECTED:'blue',TAKEDOWN:'green',CAMPAIGN:'orange',CAMPAIGN_DOWN:'green',C2_DOWN:'green',YOUTUBE_DOWN:'green',WEBHOOK_DOWN:'green'};
 // The chip is the only place a row states what HAPPENED: DETECTED and
 // TAKEDOWN each carry their verb, and a bare CAMPAIGN did not — sitting
 // beside a green TAKEDOWN it read as a campaign having been removed, when
 // pub_live_activity sources it from campaigns.first_seen and it means a
 // cluster was FOUND. Kept as a display map so the kind key (and the
 // per-kind color and rank) stays exactly what the query emits.
 const LBL={CAMPAIGN:'CAMPAIGN DETECTED',CAMPAIGN_DOWN:'CAMPAIGN TAKEDOWN',C2_DOWN:'C2 TAKEDOWN',YOUTUBE_DOWN:'VIDEO REMOVED',WEBHOOK_DOWN:'WEBHOOK DISABLED'};
 const body=rows.map((r,i)=>`<div class="arow" style="animation-delay:${i*.05}s">
   <span class="adot hx-${K[r[0]]||'blue'}"></span><span class="akind hx-${K[r[0]]||'blue'}">${LBL[r[0]]||r[0]}</span>
   <span class="atxt">${r[1]}</span><span class="aago" data-t="${r[2]}">${ago(r[2])}</span></div>`).join('');
 const e=el(`<div class="panel" style="grid-column:span ${p.span}">
  <div class="head"><span class="livedot"></span>${p.title}<span class="i" data-tip="${(p.tip||'').replace(/"/g,'&quot;')}">i</span></div>
  <div class="body"><div class="act">${body||'<div class="arow"><span class="atxt">No qualifying events in the last 7 days.</span></div>'}</div></div></div>`);
 setInterval(()=>e.querySelectorAll('.aago').forEach(n=>n.textContent=ago(n.dataset.t)),30000);
 return e}
// funnel: strictly nested stages, so each bar is a real subset of the one above.
const DEN={2:'of all detected',3:'of those reported',4:'of those confirmed offline'};
function drawFunnel(p,D){const rows=D[p.src]||[];
 // Intake dwarfs the enforcement stages by ~28x, so one linear scale renders the
 // three stages that carry the story as identical slivers. Intake is shown as a
 // figure without a bar, and the chain below is scaled among itself. No minimum
 // bar width is applied anywhere - a padded bar would misstate the ratio.
 const chain=rows.filter(r=>r[3]!=null);
 const max=Math.max(1,...chain.map(r=>+r[2]));
 const body=rows.map((r,i)=>{
  if(r[3]==null)return `<div class="frow intake"><span class="fname">${r[1]}</span>
    <div class="ftrack bare"><span class="fnum abs">${(+r[2]).toLocaleString()}</span></div>
    <span class="fpct">detected in total</span></div>
   <div class="fsub">of which, the enforcement chain &mdash; each stage a subset of the one above</div>`;
  const w=+r[2]/max*100;
  return `<div class="frow"><span class="fname">${r[1]}</span>
   <div class="ftrack"><span class="ffill" style="width:${w.toFixed(2)}%;animation-delay:${i*.08}s"></span>
    <span class="fnum">${(+r[2]).toLocaleString()}</span></div>
   <span class="fpct">${fmt(r[3],'pct')+' '+(DEN[r[0]]||'of previous')}</span></div>`}).join('');
 return el(`<div class="panel" style="grid-column:span ${p.span}">
  <div class="head">${p.title}<span class="i" data-tip="${(p.tip||'').replace(/"/g,'&quot;')}">i</span></div>
  <div class="body"><div class="fn">${body}</div>
   <div class="fnote">Most of the gap between the first row and the chain below is
   sites that had already gone offline before we could report them &mdash; a site that is
   already down is not reported to anyone. The bars are scaled to the chain, not to
   the total above it, so the top bar being full means it is the largest of the three
   &mdash; not that it is most of what we detected.</div></div></div>`)}


render(DATA,PANELS);
</script>
</body>
